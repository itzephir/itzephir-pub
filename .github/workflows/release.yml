name: Posts / Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Validate and build release bundle
        run: |
          python -m unittest discover -s tests -v
          python -m postpub check
          python -m postpub build --target release --output build/release
          cat build/release/preview.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-bundle-${{ github.run_id }}
          path: build/release/
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: validate
    if: vars.TELEGRAM_RELEASE_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: telegram-release
    permissions:
      contents: write
    concurrency:
      group: telegram-delivery
      cancel-in-progress: false
      queue: max
    steps:
      # Reconcile the current main tree so a delayed older run cannot revert newer posts.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Publish or update release posts
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TELEGRAM_RELEASE_ENABLED: ${{ vars.TELEGRAM_RELEASE_ENABLED }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION_STRING: ${{ secrets.TELEGRAM_SESSION_STRING }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
          TELEGRAM_EXPECTED_USER_ID: ${{ vars.TELEGRAM_EXPECTED_USER_ID }}
        run: |
          source_sha=$(git rev-parse HEAD)
          python -m unittest discover -s tests -v
          python -m postpub check
          python -m postpub publish --target release --ref "$source_sha" --live --output build/delivery
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: release-delivery-${{ github.run_id }}
          path: build/delivery/
          if-no-files-found: ignore
          retention-days: 14
