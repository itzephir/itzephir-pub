name: Telegram / PR Preview

on:
  workflow_run:
    workflows: [Posts / Preview]
    types: [completed]

permissions:
  contents: read

jobs:
  publish:
    if: >-
      vars.TELEGRAM_PREVIEW_ENABLED == 'true' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: telegram-preview
    permissions:
      contents: write
      pull-requests: read
    concurrency:
      group: telegram-delivery
      cancel-in-progress: false
      queue: max
    steps:
      # Never check out or execute PR code in this secret-bearing workflow.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Bind validation run to the current same-repository PR
        id: source
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m postpub preview-context
      - name: Fetch content without checking it out
        if: steps.source.outputs.eligible == 'true'
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: git fetch --no-tags origin "$SOURCE_SHA"
      - name: Publish changed-post previews
        if: steps.source.outputs.eligible == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          PR_NUMBER: ${{ steps.source.outputs.pr }}
          TELEGRAM_PREVIEW_ENABLED: ${{ vars.TELEGRAM_PREVIEW_ENABLED }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION_STRING: ${{ secrets.TELEGRAM_SESSION_STRING }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
          TELEGRAM_EXPECTED_USER_ID: ${{ vars.TELEGRAM_EXPECTED_USER_ID }}
        run: |
          base=$(git merge-base HEAD "$SOURCE_SHA")
          python -m postpub publish --target preview --pr "$PR_NUMBER" --ref "$SOURCE_SHA" --base-ref "$base" --live --output build/telegram-preview
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: telegram-preview-delivery-${{ github.run_id }}
          path: build/telegram-preview/
          if-no-files-found: ignore
          retention-days: 14

